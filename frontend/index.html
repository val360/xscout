<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arrange stock ticker lists on an infinite canvas." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>xscout</title>
    <script>
      // Resolve the saved theme before first paint so the app never flashes
      // the wrong palette. Mirrors PREFERENCES_STORAGE_KEY in src/storage/preferences.ts.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('xscout.prefs.v1') || '{}');
          var mode = saved.theme === 'light' || saved.theme === 'dark' ? saved.theme : null;
          if (!mode) {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
